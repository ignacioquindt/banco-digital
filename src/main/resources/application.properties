spring.application.name=banco-digital

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco_digital}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@banco.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Configuracion de Flyway
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Swagger de consulta; las operaciones se prueban con Postman
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.supported-submit-methods=
springdoc.packages-to-scan=com.ignacio.banco