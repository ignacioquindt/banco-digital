services:
  db-test:
    image: postgres:18.6
    environment:
      POSTGRES_DB: banco_test
      POSTGRES_USER: banco_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Definí TEST_DB_PASSWORD para la base de pruebas}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_test -d banco_test"]
      interval: 3s
      timeout: 3s
      retries: 20
