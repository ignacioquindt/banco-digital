name: Verificación
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: banco_test
          POSTGRES_USER: banco_test
          POSTGRES_PASSWORD: clave-efimera-solo-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banco_test -d banco_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/banco_test
      TEST_DB_USERNAME: banco_test
      TEST_DB_PASSWORD: clave-efimera-solo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-java
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:frontend
